name: Deploy production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lanblaster.sacha.house
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join the deployment network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-actions-deploy
          ping: homelab.panthera-python.ts.net
      - name: Install Nomad
        env:
          NOMAD_VERSION: 1.11.3
          NOMAD_SHA256: 19dac5642a2ba5305e6ff8efee06a708d760ebe4d1cd7936bc3dc526f477dc12
        run: |
          archive="$RUNNER_TEMP/nomad.zip"
          curl --fail --location --silent --show-error \
            "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$NOMAD_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/nomad-bin"
          printf '%s\n' "$RUNNER_TEMP/nomad-bin" >>"$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Promote the exact staging image
        env:
          GH_TOKEN: ${{ github.token }}
          NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          image=$(nomad job inspect -namespace staging -json lanblaster-sacha-house | jq -r .Meta.image)
          [[ "$image" =~ ^ghcr\.io/sachahjkl/lanblaster\.sacha\.house@sha256:[0-9a-f]{64}$ ]]
          cosign verify \
            --certificate-identity-regexp '^https://github.com/sachahjkl/lanblaster\.sacha\.house/\.github/workflows/ci\.yml@refs/heads/master$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image"
          cosign verify-attestation \
            --certificate-identity-regexp '^https://github.com/sachahjkl/lanblaster\.sacha\.house/\.github/workflows/ci\.yml@refs/heads/master$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type spdxjson \
            "$image"
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY"
          nomad job run -detach -namespace production -var "image=$image" deploy/nomad/production.nomad.hcl
          test "$(nomad job inspect -namespace production -json lanblaster-sacha-house | jq -r .Meta.image)" = "$image"
          version=$(nomad job inspect -namespace production -json lanblaster-sacha-house | jq -r .Version)
          for _ in $(seq 1 72); do
            status=$(nomad job status -namespace production -json lanblaster-sacha-house)
            if jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and .[0].LatestDeployment.Status == "successful"' <<<"$status" >/dev/null; then
              break
            fi
            if jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and (.[0].LatestDeployment.Status == "failed" or .[0].LatestDeployment.Status == "cancelled")' <<<"$status" >/dev/null; then
              jq '.[0].LatestDeployment' <<<"$status"
              exit 1
            fi
            sleep 5
          done
          jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and .[0].LatestDeployment.Status == "successful"' <<<"$status" >/dev/null
          curl --fail --silent --show-error --max-time 15 https://lanblaster.sacha.house/health >/dev/null
