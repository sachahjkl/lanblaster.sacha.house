name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    accept-flake-config = true
    max-jobs = 2
  NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646
  NOMAD_AUTH_AUDIENCE: nomad.sacha.house
  TS_AUDIENCE: api.tailscale.com/TWg2iR2X7G11CNTRL-k23Swjrqst11CNTRL
  TS_OAUTH_CLIENT_ID: TWg2iR2X7G11CNTRL-k23Swjrqst11CNTRL

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            max-jobs = 2
      - run: nix flake check --print-build-logs --max-jobs 2
      - run: nix flake check ./deploy/config --print-build-logs --max-jobs 2
      - run: nix run ./deploy/config -- validate

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository != 'sachahjkl/homelab-application-template'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            max-jobs = 2
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - run: nix build .#dockerImage --print-build-logs --max-jobs 2
      - id: publish
        name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#skopeo -- login \
            --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag=$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')
          nix run nixpkgs#skopeo -- copy --authfile "$authfile" --insecure-policy \
            docker-archive:result "docker://$tag"
          digest=$(nix run nixpkgs#skopeo -- inspect --authfile "$authfile" \
            --format '{{.Digest}}' "docker://$tag")
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$digest" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/application.spdx.json
        run: nix run nixpkgs#syft -- "$IMAGE" --output "spdx-json=$SBOM"
      - name: Sign image and attest SBOM
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/application.spdx.json
        run: |
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#cosign -- login \
            ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix run nixpkgs#cosign -- sign --yes "$IMAGE"
          nix run nixpkgs#cosign -- attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE"
      - name: Publish build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            max-jobs = 2
      - id: config
        run: nix run ./deploy/config -- github-output >>"$GITHUB_OUTPUT"
      - name: Join the deployment network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:github-actions-deploy
          ping: homelab.panthera-python.ts.net
      - name: Install Nomad
        env:
          NOMAD_SHA256: 19dac5642a2ba5305e6ff8efee06a708d760ebe4d1cd7936bc3dc526f477dc12
          NOMAD_VERSION: 1.11.3
        run: |
          archive="$RUNNER_TEMP/nomad.zip"
          curl --fail --location --silent --show-error \
            "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$NOMAD_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/nomad-bin"
          printf '%s\n' "$RUNNER_TEMP/nomad-bin" >>"$GITHUB_PATH"
      - name: Authenticate to Nomad
        run: |
          set -euo pipefail
          oidc=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$NOMAD_AUTH_AUDIENCE" | jq -r .value)
          token=$(nomad login -method github-actions -login-token "$oidc" -json | jq -r .SecretID)
          test -n "$token" && test "$token" != null
          printf '::add-mask::%s\n' "$token"
          printf 'NOMAD_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"
      - name: Deploy exact image to staging
        timeout-minutes: 8
        env:
          DOMAIN: ${{ steps.config.outputs.staging_domain }}
          IMAGE: ${{ needs.publish.outputs.image }}
          JOB_NAME: ${{ steps.config.outputs.name }}
          NOMAD_NAMESPACE: staging
          VOLUME_ENABLED: ${{ steps.config.outputs.volume_enabled }}
        run: |
          if [ "$VOLUME_ENABLED" = true ]; then
            volume_name="$JOB_NAME-staging-data"
            if ! nomad volume status -type host -json \
              | jq -e --arg name "$volume_name" 'any(.Name == $name)' >/dev/null; then
              volume="$RUNNER_TEMP/staging.volume.hcl"
              nix run ./deploy/config -- volume-spec staging >"$volume"
              timeout 30s nomad volume create "$volume"
            fi
          fi
          vars="$RUNNER_TEMP/staging.vars.hcl"
          nix run ./deploy/config -- nomad-vars staging "$IMAGE" >"$vars"
          pack="$RUNNER_TEMP/staging-pack"
          nix run nixpkgs#nomad-pack -- render deploy/nomad \
            --var-file "$vars" --to-dir "$pack" --auto-approve >/dev/null
          timeout 30s nomad job run -detach "$pack/homelab-application/application.nomad"
          version=$(nomad job inspect -json "$JOB_NAME" | jq -r .Version)
          healthy=false
          for _attempt in $(seq 1 90); do
            if nomad job status -json "$JOB_NAME" | jq -e --argjson version "$version" \
              '.[0].Allocations | any(.JobVersion == $version and .ClientStatus == "running" and .DeploymentStatus.Healthy == true)' \
              >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          test "$(nomad job inspect -json "$JOB_NAME" | jq -r .Meta.image)" = "$IMAGE"
          route_ready=false
          for _attempt in $(seq 1 90); do
            headers="$RUNNER_TEMP/staging.headers"
            if status=$(curl --silent --show-error --dump-header "$headers" \
              --output /dev/null --write-out '%{http_code}' \
              "https://$DOMAIN${{ steps.config.outputs.health_path }}") \
              && [ "$status" = 200 ] \
              && tr -d '\r' <"$headers" \
                | grep --ignore-case --quiet '^x-robots-tag: noindex, nofollow$'; then
              route_ready=true
              break
            fi
            sleep 2
          done
          test "$route_ready" = true
