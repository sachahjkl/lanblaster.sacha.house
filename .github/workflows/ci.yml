name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    accept-flake-config = true
    max-jobs = 2
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --print-build-logs --max-jobs 2

  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - run: nix build .#dockerImage --print-build-logs --max-jobs 2
      - id: publish
        name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          export TMPDIR="$RUNNER_TEMP/skopeo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TMPDIR"
          trap 'rm -rf "$TMPDIR"; rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#skopeo -- login --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag=$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')
          nix run nixpkgs#skopeo -- copy --authfile "$authfile" --insecure-policy docker-archive:result "docker://$tag"
          digest=$(nix run nixpkgs#skopeo -- inspect --authfile "$authfile" --format '{{.Digest}}' "docker://$tag")
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$digest" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/lanblaster.spdx.json
        run: nix run nixpkgs#syft -- "$IMAGE" --output "spdx-json=$SBOM"
      - name: Sign image and SBOM
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/lanblaster.spdx.json
        run: |
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#cosign -- login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix run nixpkgs#cosign -- sign --yes "$IMAGE"
          nix run nixpkgs#cosign -- attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE"
      - name: Publish build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lanblaster.sacha.house
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nomad
        env:
          NOMAD_VERSION: 1.11.3
          NOMAD_SHA256: 19dac5642a2ba5305e6ff8efee06a708d760ebe4d1cd7936bc3dc526f477dc12
        run: |
          archive="$RUNNER_TEMP/nomad.zip"
          curl --fail --location --silent --show-error \
            "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$NOMAD_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/nomad-bin"
          printf '%s\n' "$RUNNER_TEMP/nomad-bin" >>"$GITHUB_PATH"
      - name: Join the deployment network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:github-actions-deploy
          ping: homelab.panthera-python.ts.net
      - name: Deploy exact image to staging
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646
          NOMAD_NAMESPACE: staging
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/sachahjkl/lanblaster\.sacha\.house@sha256:[0-9a-f]{64}$ ]]
          nomad job run -detach -var "image=$IMAGE" deploy/nomad/staging.nomad.hcl
          test "$(nomad job inspect -json lanblaster-sacha-house | jq -r .Meta.image)" = "$IMAGE"
          version=$(nomad job inspect -json lanblaster-sacha-house | jq -r .Version)
          for _ in $(seq 1 72); do
            status=$(nomad job status -json lanblaster-sacha-house)
            if jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and .[0].LatestDeployment.Status == "successful"' <<<"$status" >/dev/null; then
              break
            fi
            if jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and (.[0].LatestDeployment.Status == "failed" or .[0].LatestDeployment.Status == "cancelled")' <<<"$status" >/dev/null; then
              jq '.[0].LatestDeployment' <<<"$status"
              exit 1
            fi
            sleep 5
          done
          jq -e --argjson version "$version" '.[0].LatestDeployment.JobVersion == $version and .[0].LatestDeployment.Status == "successful"' <<<"$status" >/dev/null
          curl --fail --silent --show-error --max-time 15 https://staging.lanblaster.sacha.house/health >/dev/null
